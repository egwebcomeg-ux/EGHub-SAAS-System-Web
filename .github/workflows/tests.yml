name: tests

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # production runs PHP 8.4 (ea-php84); the locked packages need 8.4.1+
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, exif, pdo_sqlite, sqlite3
          ini-values: memory_limit=1G
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      # views call @vite, so the tests need public/build/manifest.json
      - run: npm ci && npm run build

      - run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/phpunit

  # Ready-to-install builds for the server's deploy.sh (docs/DEPLOY.md section 6b): master -> `production`, a pull
  # request from this repository -> `staging`. Only after the tests pass; never for pull requests from forks, which
  # must not get code onto the server.
  publish:
    needs: tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.event_name == 'push' && 'production' || 'staging' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the server has no Node, so the build ships inside the branch
      - run: npm ci && npm run build

      - name: Push the build
        env:
          TARGET: ${{ github.event_name == 'push' && 'production' || 'staging' }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$TARGET"
          git add -f public/build
          git commit -q -m "Build of ${SOURCE}"
          git push -f origin "$TARGET"
